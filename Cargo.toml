[workspace]
resolver = "2"
members = ["crates/psst-core", "crates/psst-protocol", "crates/psst-store", "crates/psst-relay", "crates/psst-client"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/spatial-bit/psst"

[workspace.dependencies]
base64 = "0.22.1"
getrandom = "0.3.4"
http = "1.3.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.21.0"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
utoipa = { version = "5.4.0", features = ["time"] }
axum = "0.8.4"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
tower = { version = "0.5.2", features = ["util", "limit"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
