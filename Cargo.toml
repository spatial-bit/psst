[workspace]
resolver = "2"
members = ["crates/psst-core", "crates/psst-store"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/spatial-bit/psst"

[workspace.dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
sha2 = "0.10.9"
tempfile = "3.21.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
